<!DOCTYPE html>
<html lang="en">
<head>
	<title>Sort Visualizer</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

	<script src='algs/vars.js'></script>
	<script src='algs/algfuncs.js'></script>
	<script src='algs/heapsort.js'></script>
	<script src='algs/bubblesort.js'></script>
	<script src='algs/quicksort.js'></script>
	<script src='algs/gnomesort.js'></script>
	<script src='algs/bogosort.js'></script>
	<script src='algs/mergesort.js'></script>
	<script src='algs/shakersort.js'></script>
	<script src='funcs.js'></script>
	<script src='genfield.js'></script>

	<link rel='stylesheet' type='text/css' href='css/buttons.css'>
	<link rel='stylesheet' type='text/css' href='css/opts.css'>
	<link rel='stylesheet' type='text/css' href='css/other.css'>
</head>

<body onload='genBars(); setDelay();'>

<div class="container">

	<header class="site-header">
		<h1 class="site-title">Sort Visualizer</h1>
		<p class="site-subtitle">Watch sorting algorithms in real time</p>
	</header>

	<div id='buttons'>
		<div id='fast'>
			<div class='title'>Efficient Algorithms</div>
			<button onclick='runAlg(quickSort)' class='button'>Quicksort</button>
			<button onclick='runAlg(mergeSort)' class='button'>Merge Sort</button>
			<button onclick='runAlg(heapSort)' class='button'>Heapsort</button>
		</div>
		<div id='educ'>
			<div class='title'>Educational Algorithms</div>
			<button onclick='runAlg(shakerSort)' class='button'>Cocktail Shaker</button>
			<button onclick='runAlg(bubbleSort)' class='button'>Bubble Sort</button>
			<button onclick='runAlg(gnomeSort)' class='button'>Gnome Sort</button>
			<button onclick='runAlg(bogoSort)' class='button'>Bogosort</button>
		</div>
	</div>

	<div class="controls-row">
		<div id='opts'>
			<div class='box'>
				<span class="slider-label">Bars</span>
				<input class='slider' type='range' min='3' max='300' value='100' id='nBars' oninput='genBars()'>
			</div>
			<div class='box'>
				<span class="slider-label">Height</span>
				<input class='slider' type='range' min='100' max='1000' value='500' id='height' oninput='resize()'>
			</div>
			<div class='box'>
				<span class="slider-label">Speed</span>
				<input class='slider' type='range' min='0' max='10' value='5' step="0.25" id='delay' oninput='setDelay()'>
			</div>
		</div>
		<div id='actions'>
			<button onclick='genBars()' class='button' id='new-field'>New Field</button>
			<button onclick='hide()' class='button secondary-btn' id='hide'>Toggle Sliders</button>
			<a href='https://en.wikipedia.org/wiki/Sorting_algorithm#Popular_sorting_algorithms' target='_blank' id="wikipedia-button">
				<img src='wikipedia.svg' alt="Wikipedia">
			</a>
		</div>
	</div>

	<div id='note' onclick='hideNote()'>
		Animations don't reflect actual sorting speed.&ensp;<span class="note-dismiss">Click to dismiss &rarr;</span>
	</div>

	<div id='field'></div>

</div>

<div style='height: 80px;'></div>

</body>
</html>
